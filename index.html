<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tetris Game</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
}

/* ===== 背景画像を確実表示 ===== */
body{
  display:flex;
  justify-content:center;
  align-items:center;

  /* ↓ ここが重要 */
  background:url("./76192040.jpg") center center / cover no-repeat fixed;

  position:relative;
}

/* 黒を薄くする（画像を見えるように） */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.25);
  z-index:0;
}

/* ゲーム全体 */
.game-wrapper{
  position:relative;
  z-index:1;

  display:flex;
  gap:20px;
  align-items:flex-start;
}

/* ゲーム画面 */
canvas{
  border:4px solid #fff;
  background:rgba(0,0,0,0.55);

  box-shadow:
    0 0 20px rgba(255,255,255,0.4),
    0 0 50px rgba(0,0,0,0.7);
}

/* 右パネル */
.side-panel{
  width:220px;
  padding:20px;

  color:#fff;

  background:rgba(0,0,0,0.45);

  border:2px solid rgba(255,255,255,0.3);

  border-radius:15px;

  backdrop-filter:blur(4px);
}

.side-panel h2{
  font-size:28px;
  margin-bottom:15px;
}

.score{
  font-size:38px;
  margin-bottom:25px;
}

.controls{
  line-height:2;
  font-size:15px;
}

/* GAME OVER */
#gameOverText{
  position:absolute;
  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  color:#fff;

  font-size:48px;
  font-weight:bold;

  text-shadow:
    0 0 10px #000,
    0 0 20px #000;

  display:none;

  z-index:10;
}
</style>
</head>

<body>

<div class="game-wrapper">

  <canvas id="tetris" width="240" height="400"></canvas>

  <div id="gameOverText">
    GAME OVER
  </div>

  <div class="side-panel">
    <h2>SCORE</h2>

    <div class="score" id="score">0</div>

    <div class="controls">
      ← → ：移動<br>
      ↓ ：落下<br>
      ↑ ：回転<br>
      SPACE：一気落下
    </div>
  </div>

</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');

context.scale(20, 20);

const scoreElement = document.getElementById('score');
const gameOverText = document.getElementById('gameOverText');

const arena = createMatrix(12, 20);

const player = {
  pos:{x:0,y:0},
  matrix:null,
  score:0
};

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let gameOver = false;

function createMatrix(w,h){
  const matrix = [];

  while(h--){
    matrix.push(new Array(w).fill(0));
  }

  return matrix;
}

function createPiece(type){

  if(type === 'T'){
    return [
      [0,0,0],
      [1,1,1],
      [0,1,0],
    ];
  }

  if(type === 'O'){
    return [
      [2,2],
      [2,2],
    ];
  }

  if(type === 'L'){
    return [
      [0,3,0],
      [0,3,0],
      [0,3,3],
    ];
  }

  if(type === 'J'){
    return [
      [0,4,0],
      [0,4,0],
      [4,4,0],
    ];
  }

  if(type === 'I'){
    return [
      [0,5,0,0],
      [0,5,0,0],
      [0,5,0,0],
      [0,5,0,0],
    ];
  }

  if(type === 'S'){
    return [
      [0,6,6],
      [6,6,0],
      [0,0,0],
    ];
  }

  if(type === 'Z'){
    return [
      [7,7,0],
      [0,7,7],
      [0,0,0],
    ];
  }
}

function drawMatrix(matrix, offset){

  matrix.forEach((row, y) => {

    row.forEach((value, x) => {

      if(value !== 0){

        context.fillStyle = colors[value];

        context.fillRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );

        context.strokeStyle = '#000';

        context.lineWidth = 0.05;

        context.strokeRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );
      }
    });
  });
}

function draw(){

  context.fillStyle = 'rgba(0,0,0,0.15)';

  context.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawMatrix(arena, {x:0,y:0});

  drawMatrix(player.matrix, player.pos);
}

function merge(arena, player){

  player.matrix.forEach((row, y) => {

    row.forEach((value, x) => {

      if(value !== 0){

        arena[y + player.pos.y][x + player.pos.x] = value;

      }
    });
  });
}

function collide(arena, player){

  const [m,o] = [player.matrix, player.pos];

  for(let y=0; y<m.length; ++y){

    for(let x=0; x<m[y].length; ++x){

      if(
        m[y][x] !== 0 &&
        (
          arena[y + o.y] &&
          arena[y + o.y][x + o.x]
        ) !== 0
      ){
        return true;
      }
    }
  }

  return false;
}

function playerDrop(){

  player.pos.y++;

  if(collide(arena, player)){

    player.pos.y--;

    merge(arena, player);

    playerReset();

    arenaSweep();

    updateScore();
  }

  dropCounter = 0;
}

function playerMove(dir){

  player.pos.x += dir;

  if(collide(arena, player)){
    player.pos.x -= dir;
  }
}

function rotate(matrix){

  for(let y=0; y<matrix.length; ++y){

    for(let x=0; x<y; ++x){

      [
        matrix[x][y],
        matrix[y][x]
      ] = [
        matrix[y][x],
        matrix[x][y]
      ];
    }
  }

  matrix.forEach(row => row.reverse());
}

function playerRotate(){

  const pos = player.pos.x;

  let offset = 1;

  rotate(player.matrix);

  while(collide(arena, player)){

    player.pos.x += offset;

    offset = -(offset + (offset > 0 ? 1 : -1));

    if(offset > player.matrix[0].length){

      rotate(player.matrix);
      rotate(player.matrix);
      rotate(player.matrix);

      player.pos.x = pos;

      return;
    }
  }
}

function arenaSweep(){

  let rowCount = 1;

  outer:
  for(let y=arena.length - 1; y>0; --y){

    for(let x=0; x<arena[y].length; ++x){

      if(arena[y][x] === 0){
        continue outer;
      }
    }

    const row = arena.splice(y,1)[0].fill(0);

    arena.unshift(row);

    ++y;

    player.score += rowCount * 10;

    rowCount *= 2;
  }
}

function playerReset(){

  const pieces = 'TJLOSZI';

  player.matrix = createPiece(
    pieces[
      pieces.length * Math.random() | 0
    ]
  );

  player.pos.y = 0;

  player.pos.x =
    (
      arena[0].length / 2 |
      0
    ) -
    (
      player.matrix[0].length / 2 |
      0
    );

  if(collide(arena, player)){

    gameOver = true;

    gameOverText.style.display = 'block';
  }
}

function updateScore(){

  scoreElement.innerText = player.score;
}

function update(time = 0){

  if(gameOver) return;

  const deltaTime = time - lastTime;

  lastTime = time;

  dropCounter += deltaTime;

  if(dropCounter > dropInterval){
    playerDrop();
  }

  draw();

  requestAnimationFrame(update);
}

document.addEventListener('keydown', event => {

  if(gameOver) return;

  if(event.keyCode === 37){
    playerMove(-1);
  }

  else if(event.keyCode === 39){
    playerMove(1);
  }

  else if(event.keyCode === 40){
    playerDrop();
  }

  else if(event.keyCode === 38){
    playerRotate();
  }

  else if(event.code === 'Space'){

    while(!collide(arena, player)){
      player.pos.y++;
    }

    player.pos.y--;

    playerDrop();
  }
});

const colors = [
  null,
  '#FF0D72',
  '#0DC2FF',
  '#0DFF72',
  '#F538FF',
  '#FF8E0D',
  '#FFE138',
  '#3877FF',
];

playerReset();
updateScore();
update();
</script>

</body>
</html>

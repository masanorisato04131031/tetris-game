<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panda Tetris</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.game-container{
  display:flex;
  gap:30px;
  align-items:center;
}

.left-panel{
  width:220px;
}

.right-panel{
  width:260px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

h1{
  font-size:48px;
  margin-bottom:30px;
}

.score-box{
  background:#222;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  font-size:22px;
}

.controls{
  margin-top:30px;
  line-height:2;
}

canvas{
  border:4px solid white;
  background:black;
}

.panda-box{
  position:relative;
  width:220px;
  height:320px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.status-text{
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
  text-align:center;
}

/* ===== パンダ ===== */

.panda{
  position:relative;
  width:180px;
  height:260px;
  animation:dance 0.6s infinite alternate;
}

@keyframes dance{
  from{
    transform:translateY(0px) rotate(-2deg);
  }
  to{
    transform:translateY(-8px) rotate(2deg);
  }
}

.head{
  position:absolute;
  width:140px;
  height:130px;
  background:white;
  border-radius:50%;
  top:0;
  left:20px;
}

.ear{
  position:absolute;
  width:45px;
  height:45px;
  background:black;
  border-radius:50%;
}

.ear.left{
  left:10px;
  top:-10px;
}

.ear.right{
  right:10px;
  top:-10px;
}

.eye{
  position:absolute;
  width:30px;
  height:40px;
  background:black;
  border-radius:50%;
  top:45px;
}

.eye.left{
  left:28px;
}

.eye.right{
  right:28px;
}

.eye::after{
  content:'';
  position:absolute;
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  top:8px;
  left:8px;
}

.nose{
  position:absolute;
  width:18px;
  height:14px;
  background:black;
  border-radius:50%;
  top:78px;
  left:61px;
}

.mouth{
  position:absolute;
  width:40px;
  height:20px;
  border-bottom:4px solid black;
  border-radius:0 0 40px 40px;
  top:92px;
  left:50px;
  transition:0.3s;
}

.body{
  position:absolute;
  width:120px;
  height:120px;
  background:white;
  border-radius:45%;
  top:110px;
  left:30px;
}

.arm{
  position:absolute;
  width:35px;
  height:80px;
  background:black;
  border-radius:30px;
  top:120px;
}

.arm.left{
  left:10px;
  transform-origin:top center;
  animation:armLeft 0.5s infinite alternate;
}

.arm.right{
  right:10px;
  transform-origin:top center;
  animation:armRight 0.5s infinite alternate;
}

@keyframes armLeft{
  from{
    transform:rotate(20deg);
  }
  to{
    transform:rotate(-20deg);
  }
}

@keyframes armRight{
  from{
    transform:rotate(-20deg);
  }
  to{
    transform:rotate(20deg);
  }
}

.leg{
  position:absolute;
  width:40px;
  height:70px;
  background:black;
  border-radius:30px;
  top:205px;
}

.leg.left{
  left:40px;
}

.leg.right{
  right:40px;
}

/* ===== 不安状態 ===== */

.panda.worried .mouth{
  border-bottom:none;
  border-top:4px solid #fff;
  border-radius:40px 40px 0 0;
  top:105px;
}

.panda.worried{
  animation-duration:1s;
}

/* ===== 泣きそう状態 ===== */

.panda.cry .mouth{
  border-bottom:none;
  border-top:5px solid #fff;
  border-radius:50px 50px 0 0;
  top:108px;
}

.panda.cry .eye::before{
  content:'';
  position:absolute;
  width:6px;
  height:18px;
  background:#66ccff;
  left:12px;
  top:34px;
  border-radius:10px;
}

.panda.cry{
  animation-duration:1.5s;
}
</style>
</head>

<body>

<div class="game-container">

  <!-- 左 -->
  <div class="left-panel">

    <h1>TETRIS</h1>

    <div class="score-box">
      <div>Score</div>
      <span id="score">0</span>
    </div>

    <div class="score-box">
      <div>Lines</div>
      <span id="lines">0</span>
    </div>

    <div class="controls">
      <h2>操作方法</h2>
      <p>← → : 移動</p>
      <p>↑ : 回転</p>
      <p>↓ : 高速落下</p>
      <p>Space : 一気に落下</p>
      <p>P : 一時停止</p>
    </div>

  </div>

  <!-- テトリス -->
  <canvas id="tetris" width="300" height="600"></canvas>

  <!-- 右 -->
  <div class="right-panel">

    <div class="panda-box">

      <div class="panda" id="panda">

        <div class="head">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>

          <div class="mouth"></div>

        </div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

      </div>

    </div>

    <div class="status-text" id="pandaStatus">
      😊 ごきげん♪
    </div>

  </div>

</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');

context.scale(30, 30);

const scoreElement = document.getElementById('score');
const linesElement = document.getElementById('lines');

const panda = document.getElementById('panda');
const pandaStatus = document.getElementById('pandaStatus');

const arena = createMatrix(10, 20);

const colors = [
  null,
  '#FF0D72',
  '#0DC2FF',
  '#0DFF72',
  '#F538FF',
  '#FF8E0D',
  '#FFE138',
  '#3877FF',
];

const player = {
  pos: {x: 0, y: 0},
  matrix: null,
  score: 0,
  lines: 0,
};

let isPaused = false;

function createMatrix(w, h) {
  const matrix = [];
  while (h--) {
    matrix.push(new Array(w).fill(0));
  }
  return matrix;
}

function createPiece(type) {

  if (type === 'T') {
    return [
      [0,0,0],
      [1,1,1],
      [0,1,0],
    ];
  }

  else if (type === 'O') {
    return [
      [2,2],
      [2,2],
    ];
  }

  else if (type === 'L') {
    return [
      [0,3,0],
      [0,3,0],
      [0,3,3],
    ];
  }

  else if (type === 'J') {
    return [
      [0,4,0],
      [0,4,0],
      [4,4,0],
    ];
  }

  else if (type === 'I') {
    return [
      [0,5,0,0],
      [0,5,0,0],
      [0,5,0,0],
      [0,5,0,0],
    ];
  }

  else if (type === 'S') {
    return [
      [0,6,6],
      [6,6,0],
      [0,0,0],
    ];
  }

  else if (type === 'Z') {
    return [
      [7,7,0],
      [0,7,7],
      [0,0,0],
    ];
  }
}

function drawMatrix(matrix, offset) {

  matrix.forEach((row, y) => {

    row.forEach((value, x) => {

      if (value !== 0) {

        context.fillStyle = colors[value];

        context.fillRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );

        context.strokeStyle = '#111';
        context.lineWidth = 0.05;

        context.strokeRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );
      }
    });
  });
}

function draw() {

  context.fillStyle = '#000';

  context.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawMatrix(arena, {x:0, y:0});

  if(player.matrix){
    drawMatrix(player.matrix, player.pos);
  }

  if (isPaused) {

    context.fillStyle = 'rgba(0,0,0,0.7)';
    context.fillRect(0, 8, 10, 4);

    context.font = '1px Arial';
    context.fillStyle = '#fff';
    context.textAlign = 'center';

    context.fillText('PAUSED', 5, 10);
  }
}

function merge(arena, player) {

  player.matrix.forEach((row, y) => {

    row.forEach((value, x) => {

      if (value !== 0) {

        arena[y + player.pos.y][x + player.pos.x] = value;

      }
    });
  });
}

function collide(arena, player) {

  const [m, o] = [player.matrix, player.pos];

  for (let y = 0; y < m.length; ++y) {

    for (let x = 0; x < m[y].length; ++x) {

      if (
        m[y][x] !== 0 &&
        (arena[y + o.y] &&
        arena[y + o.y][x + o.x]) !== 0
      ) {
        return true;
      }
    }
  }

  return false;
}

function playerDrop() {

  player.pos.y++;

  if (collide(arena, player)) {

    player.pos.y--;

    merge(arena, player);

    playerReset();

    arenaSweep();

    updateScore();
  }

  dropCounter = 0;
}

function hardDrop() {

  while (!collide(arena, player)) {
    player.pos.y++;
  }

  player.pos.y--;

  merge(arena, player);

  playerReset();

  arenaSweep();

  updateScore();

  dropCounter = 0;
}

function playerMove(dir) {

  player.pos.x += dir;

  if (collide(arena, player)) {
    player.pos.x -= dir;
  }
}

function playerReset() {

  const pieces = 'TJLOSZI';

  player.matrix = createPiece(
    pieces[(pieces.length * Math.random()) | 0]
  );

  player.pos.y = 0;

  player.pos.x =
    ((arena[0].length / 2) | 0) -
    ((player.matrix[0].length / 2) | 0);

  if (collide(arena, player)) {

    arena.forEach(row => row.fill(0));

    player.score = 0;
    player.lines = 0;

    updateScore();
  }
}

function rotate(matrix, dir) {

  for (let y = 0; y < matrix.length; ++y) {

    for (let x = 0; x < y; ++x) {

      [
        matrix[x][y],
        matrix[y][x],
      ] = [
        matrix[y][x],
        matrix[x][y],
      ];
    }
  }

  if (dir > 0) {
    matrix.forEach(row => row.reverse());
  }

  else {
    matrix.reverse();
  }
}

function playerRotate(dir) {

  const pos = player.pos.x;

  let offset = 1;

  rotate(player.matrix, dir);

  while (collide(arena, player)) {

    player.pos.x += offset;

    offset = -(offset + (offset > 0 ? 1 : -1));

    if (offset > player.matrix[0].length) {

      rotate(player.matrix, -dir);

      player.pos.x = pos;

      return;
    }
  }
}

function arenaSweep() {

  let rowCount = 1;

  outer:
  for (let y = arena.length - 1; y > 0; --y) {

    for (let x = 0; x < arena[y].length; ++x) {

      if (arena[y][x] === 0) {
        continue outer;
      }
    }

    const row = arena.splice(y, 1)[0].fill(0);

    arena.unshift(row);

    ++y;

    player.score += rowCount * 100;

    player.lines += 1;

    rowCount *= 2;
  }
}

function updateScore() {

  scoreElement.innerText = player.score;
  linesElement.innerText = player.lines;
}

function getStackHeight() {

  for (let y = 0; y < arena.length; y++) {

    for (let x = 0; x < arena[y].length; x++) {

      if (arena[y][x] !== 0) {
        return arena.length - y;
      }
    }
  }

  return 0;
}

function updatePandaMood() {

  const height = getStackHeight();

  panda.classList.remove('worried');
  panda.classList.remove('cry');

  if (height >= 15) {

    panda.classList.add('cry');

    pandaStatus.innerHTML = '😭 もう限界かも…';

  }

  else if (height >= 7) {

    panda.classList.add('worried');

    pandaStatus.innerHTML = '😰 ちょっと危険…';

  }

  else {

    pandaStatus.innerHTML = '😊 ごきげん♪';

  }
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;

function update(time = 0) {

  const deltaTime = time - lastTime;

  lastTime = time;

  if (!isPaused) {

    dropCounter += deltaTime;

    if (dropCounter > dropInterval) {
      playerDrop();
    }
  }

  draw();

  updatePandaMood();

  requestAnimationFrame(update);
}

document.addEventListener('keydown', event => {

  if (event.key === 'p' || event.key === 'P') {

    isPaused = !isPaused;

    return;
  }

  if (isPaused) return;

  if (event.key === 'ArrowLeft') {
    playerMove(-1);
  }

  else if (event.key === 'ArrowRight') {
    playerMove(1);
  }

  else if (event.key === 'ArrowDown') {
    playerDrop();
  }

  else if (event.key === 'ArrowUp') {
    playerRotate(1);
  }

  else if (event.code === 'Space') {
    hardDrop();
  }
});

playerReset();
updateScore();
update();
</script>

</body>
</html>
